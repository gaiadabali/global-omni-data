# nginx vhost for the GOD dashboard (staging). Install as /etc/nginx/sites-available/dashboard.god.gaiada.com.conf and
# symlink it into sites-enabled (infra/dashboard/RUNBOOK.md step 5). Needs the certificate first (step 4).
# The port in proxy_pass must match GOD_PORT of the deploy (3125 by default).
#
# NO Content-Security-Policy here: the app sends its own, with a fresh nonce per request (src/proxy.ts). A second
# policy from nginx would be intersected with it and break the nonce'd scripts. nginx adds only what the app cannot:
# HSTS (no preload) and, on staging, X-Robots-Tag noindex. Every other security header comes from the app.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.god.gaiada.com;

    # certbot --webroot answers its challenge from here, over plain http.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme/dashboard.god.gaiada.com;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.god.gaiada.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.god.gaiada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.god.gaiada.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:god_dashboard_tls:2m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;   # one year, no includeSubDomains, no preload
    add_header X-Robots-Tag "noindex, nofollow" always;               # staging only: remove when this becomes production

    # Helios gzips little by default: say what to compress. Next already sends .next/static files with long cache headers.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # The dashboard takes small forms and JSON only. No uploads.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
